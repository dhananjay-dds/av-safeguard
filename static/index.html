<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Design Safeguard V3 (Physics Engine)</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #0A192F;
            color: #CCD6F6;
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            box-sizing: border-box;
        }

        .container {
            background: #112240;
            padding: 2rem;
            border-radius: 12px;
            max-width: 600px;
            width: 100%;
            border: 1px solid #233554;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        h1 {
            color: #D4AF37;
            text-align: center;
            margin-bottom: 30px;
        }

        h3 {
            color: #64ffda;
            border-bottom: 1px solid #233554;
            padding-bottom: 5px;
            margin-top: 25px;
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        label {
            display: block;
            margin-top: 10px;
            color: #8892b0;
            font-size: 0.85em;
            font-weight: 500;
        }

        input,
        select {
            width: 100%;
            padding: 10px;
            background: #0A192F;
            border: 1px solid #233554;
            color: white;
            border-radius: 6px;
            box-sizing: border-box;
        }

        .run-btn {
            width: 100%;
            margin-top: 30px;
            padding: 16px;
            background: #D4AF37;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
            color: #0A192F;
            transition: transform 0.2s;
        }

        .run-btn:hover {
            transform: scale(1.02);
        }

        .result-box {
            margin-top: 30px;
            padding: 20px;
            background: rgba(10, 25, 47, 0.8);
            border-radius: 8px;
            border: 1px solid #D4AF37;
            display: none;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            border-bottom: 1px solid #233554;
            padding-bottom: 8px;
        }

        .pass {
            color: #64ffda;
            font-weight: bold;
        }

        .fail {
            color: #ff5f5f;
            font-weight: bold;
        }

        .warn {
            color: #ffc107;
            font-weight: bold;
        }

        .pdf-btn {
            display: block;
            width: 100%;
            text-align: center;
            background-color: #64ffda;
            color: #0A192F;
            padding: 16px;
            margin-top: 20px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 900;
            box-sizing: border-box;
        }


        /* --- MOBILE OPTIMIZATION --- */
        @media (max-width: 600px) {
            body {
                padding: 10px;
            }

            .container {
                padding: 1rem;
            }

            /* FORCE ALL GRIDS TO STACK VERTICALLY */
            .grid {
                grid-template-columns: 1fr !important;
                gap: 10px;
            }

            /* Fix the Client/Project Inputs */
            #clientName,
            #projectName {
                width: 100%;
                margin-bottom: 5px;
            }

            h1 {
                font-size: 1.5rem;
                margin-top: 0;
            }

            .stat-row {
                font-size: 0.9rem;
            }

            .pdf-btn {
                font-size: 1rem;
                padding: 14px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Design Safeguard <span style="font-size:0.5em; opacity:0.6">V3.0</span></h1>

        <div class="grid">
            <div>
                <label>Client Name</label>
                <input type="text" id="clientName" placeholder="e.g. Smith Residence">
            </div>
            <div>
                <label>Project Name</label>
                <input type="text" id="projectName" placeholder="e.g. Cinema Room">
            </div>
        </div>
        <label>Integrator / Company</label>
        <input type="text" id="integratorName" placeholder="e.g. Your Company Name">


        <h3>1. Room Dimensions</h3>
        <label>Unit Standard</label><select id="unit">
            <option value="Meters">Metric (Meters)</option>
            <option value="Feet">Imperial (Feet)</option>
        </select>
        <div class="grid">
            <div><label>Room Depth</label><input type="number" id="length" value="6.0"></div>
            <div><label>Room Width</label><input type="number" id="width" value="4.5"></div>
        </div>
        <div><label>Room Height (Important for Audio)</label><input type="number" id="height" value="3.0"></div>

        <h3>2. Screen & Projector</h3>
        <div class="grid">
            <div><label>Screen Width</label><input type="number" id="screenWidth" value="3.5"></div>
            <div><label>Aspect Ratio</label><select id="aspect">
                    <option value="1.777">16:9 (TV)</option>
                    <option value="2.35">2.35:1 (Cinema)</option>
                </select></div>
        </div>
        <div class="grid">
            <div><label>Screen Gain</label><input type="number" id="screenGain" value="1.0" step="0.1"></div>
            <div><label>Proj Lumens</label><input type="number" id="lumens" value="2500"></div>
        </div>
        <div class="grid">
            <div><label>Min Throw Ratio</label><input type="number" id="trMin" value="1.4"></div>
            <div><label>Max Throw Ratio</label><input type="number" id="trMax" value="2.8"></div>
        </div>

        <h3>3. Seating & Audio (V3 New)</h3>
        <div class="grid">
            <div><label>Seat Distance</label><input type="number" id="seatDist" value="4.5"></div>
            <div><label>Sofa Width</label><input type="number" id="sofaWidth" value="3.0"></div>
        </div>
        <div class="grid">
            <div><label>Center Spkr Ht (Floor)</label><input type="number" id="spkrHeight" value="0.5"></div>
            <div><label>Ear Height</label><input type="number" id="earHeight" value="1.1"></div>
        </div>

        <button class="run-btn" onclick="runCheck()">RUN V3 PHYSICS AUDIT</button>

        <div id="results" class="result-box">
            <h3 style="color:#D4AF37; margin-top:0;">Audit Results</h3>
            <div class="stat-row"><span>Throw Distance:</span> <span id="res-throw">--</span></div>
            <div class="stat-row"><span>Brightness:</span> <span id="res-bright">--</span></div>
            <div class="stat-row"><span>Off-Axis Seating:</span> <span id="res-offaxis">--</span></div>
            <div class="stat-row"><span>Audio Vert Angle:</span> <span id="res-audio">--</span></div>
            <a id="pdf-link" href="#" target="_blank" class="pdf-btn">OPEN V3 ENGINEERING REPORT &#x2197;</a>
        </div>
    </div>

    <script>
        document.getElementById('unit').addEventListener('change', function () {
            if (this.value === "Feet") {
                document.getElementById('length').value = "20"; document.getElementById('width').value = "15"; document.getElementById('height').value = "10";
                document.getElementById('screenWidth').value = "11.5"; document.getElementById('seatDist').value = "14";
                document.getElementById('sofaWidth').value = "10"; document.getElementById('spkrHeight').value = "2"; document.getElementById('earHeight').value = "3.5";
            } else {
                document.getElementById('length').value = "6.0"; document.getElementById('width').value = "4.5"; document.getElementById('height').value = "3.0";
                document.getElementById('screenWidth').value = "3.5"; document.getElementById('seatDist').value = "4.5";
                document.getElementById('sofaWidth').value = "3.0"; document.getElementById('spkrHeight').value = "0.5"; document.getElementById('earHeight').value = "1.1";
            }
        });

        async function runCheck() {
            const btn = document.querySelector('.run-btn');
            btn.innerText = "CALCULATING...";

            const data = {
                client_name: document.getElementById('clientName').value,
                project_name: document.getElementById('projectName').value,
                integrator_name: document.getElementById('integratorName').value,
                measurement_unit: document.getElementById('unit').value,
                length: parseFloat(document.getElementById('length').value),
                width: parseFloat(document.getElementById('width').value),
                height: parseFloat(document.getElementById('height').value),
                screen_width: parseFloat(document.getElementById('screenWidth').value),
                screen_aspect_ratio: parseFloat(document.getElementById('aspect').value),
                screen_gain: parseFloat(document.getElementById('screenGain').value),
                projector_lumens: parseInt(document.getElementById('lumens').value),
                throw_ratio_min: parseFloat(document.getElementById('trMin').value),
                throw_ratio_max: parseFloat(document.getElementById('trMax').value),
                seating_distance: parseFloat(document.getElementById('seatDist').value),
                sofa_width: parseFloat(document.getElementById('sofaWidth').value),
                center_speaker_height: parseFloat(document.getElementById('spkrHeight').value),
                ear_height: parseFloat(document.getElementById('earHeight').value)
            };

            try {
                const response = await fetch('/report', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                if (!response.ok) throw new Error(await response.text());
                const result = await response.json();

                const r = result.calculations;
                document.getElementById('res-throw').innerHTML = `<span class="${r.throw_status === 'PASS' ? 'pass' : 'fail'}">${r.throw_status}</span>`;
                document.getElementById('res-bright').innerHTML = `<span class="${r.brightness_status === 'PASS' ? 'pass' : 'warn'}">${r.ftl} fL (${r.brightness_status})</span>`;
                document.getElementById('res-offaxis').innerHTML = `<span class="${r.off_axis_status === 'PASS' ? 'pass' : 'fail'}">${r.off_axis_status}</span>`;
                document.getElementById('res-audio').innerHTML = `<span class="${r.audio_status === 'PASS' ? 'pass' : 'fail'}">${r.audio_status}</span>`;

                document.getElementById('pdf-link').href = "/" + result.pdf_url;
                document.getElementById('results').style.display = 'block';
                document.getElementById('results').scrollIntoView({ behavior: 'smooth' });
                btn.innerText = "RUN V3 PHYSICS AUDIT";
            } catch (e) {
                alert("ERROR: " + e.message);
                btn.innerText = "ERROR - TRY AGAIN";
            }
        }
    </script>
</body>

</html>
