<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AV Safeguard V2.2</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #0A192F;
            color: #CCD6F6;
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            box-sizing: border-box;
        }

        .container {
            background: #112240;
            padding: 2rem;
            border-radius: 12px;
            max-width: 600px;
            width: 100%;
            border: 1px solid #233554;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            box-sizing: border-box;
        }

        h1 {
            color: #D4AF37;
            text-align: center;
            margin-bottom: 30px;
            line-height: 1.2;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        label {
            display: block;
            margin-top: 15px;
            color: #8892b0;
            font-size: 0.9em;
            font-weight: 500;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            background: #0A192F;
            border: 1px solid #233554;
            color: white;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 16px;
            /* 16px prevents iOS zoom */
        }

        ::placeholder {
            color: #556080;
            opacity: 1;
        }

        /* THE MAIN ACTION BUTTON */
        .run-btn {
            width: 100%;
            margin-top: 30px;
            padding: 16px;
            background: #D4AF37;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
            color: #0A192F;
            transition: transform 0.2s;
        }

        .run-btn:hover {
            transform: scale(1.02);
        }

        /* THE RESULTS BOX */
        .result-box {
            margin-top: 30px;
            padding: 20px;
            background: rgba(10, 25, 47, 0.8);
            border-radius: 8px;
            border: 1px solid #D4AF37;
            display: none;
            animation: fadeIn 0.5s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            border-bottom: 1px solid #233554;
            padding-bottom: 8px;
        }

        .pass {
            color: #64ffda;
            font-weight: bold;
        }

        .fail {
            color: #ff5f5f;
            font-weight: bold;
        }

        .warn {
            color: #ffc107;
            font-weight: bold;
        }

        .pdf-btn {
            display: block;
            width: 100%;
            text-align: center;
            background-color: #64ffda;
            color: #0A192F;
            padding: 16px;
            margin-top: 20px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 900;
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(100, 255, 218, 0.3);
            box-sizing: border-box;
        }

        /* --- MOBILE OPTIMIZATION --- */
        @media (max-width: 600px) {
            body {
                padding: 10px;
            }

            .container {
                padding: 1.5rem;
            }

            .grid {
                grid-template-columns: 1fr;
                gap: 0;
            }

            /* Stack inputs vertically */
            h1 {
                font-size: 1.5rem;
                margin-top: 0;
            }

            .stat-row {
                font-size: 0.9rem;
            }

            .pdf-btn {
                font-size: 1rem;
                padding: 14px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Design Safeguard <span style="font-size:0.5em; opacity:0.6">V2.2</span></h1>

        <label>Client Name</label><input type="text" id="clientName" placeholder="e.g. Smith Residence">
        <label>Project Name</label><input type="text" id="projectName" placeholder="e.g. Cinema Room">
        <label>Integrator / Company</label><input type="text" id="integratorName" placeholder="e.g. Your Company Name">

        <label>Unit Standard</label>
        <select id="unit">
            <option value="Meters">Metric (Meters)</option>
            <option value="Feet">Imperial (Feet)</option>
        </select>

        <div class="grid">
            <div><label>Room Depth</label><input type="number" id="length" value="6.0"></div>
            <div><label>Room Width</label><input type="number" id="width" value="4.5"></div>
        </div>
        <div class="grid">
            <div><label>Screen Width</label><input type="number" id="screenWidth" value="3.5"></div>
            <div><label>Aspect Ratio</label>
                <select id="aspect">
                    <option value="1.777">16:9 (Standard TV)</option>
                    <option value="2.35">2.35:1 (Widescreen Cinema)</option>
                </select>
            </div>
        </div>
        <div class="grid">
            <div><label>Min Throw Ratio</label><input type="number" id="trMin" value="1.4"></div>
            <div><label>Max Throw Ratio</label><input type="number" id="trMax" value="2.8"></div>
        </div>
        <div class="grid">
            <div><label>Seat Dist</label><input type="number" id="seatDist" value="4.5"></div>
            <div><label>Ambient Light</label>
                <select id="light">
                    <option value="Dark Theater">Dark Theater (0 Lux)</option>
                    <option value="Media Room">Media Room (Some Light)</option>
                    <option value="Living Room">Living Room (Bright)</option>
                </select>
            </div>
        </div>
        <label>Projector Lumens</label><input type="number" id="lumens" value="2500">

        <button class="run-btn" onclick="runCheck()">RUN PHYSICS AUDIT</button>

        <div id="results" class="result-box">
            <h3 style="color:#D4AF37; margin-top:0; border-bottom:1px solid #D4AF37; padding-bottom:10px;">Audit Results
            </h3>
            <div class="stat-row"><span>Brightness:</span> <span id="res-bright">--</span></div>
            <div class="stat-row"><span>Throw Distance:</span> <span id="res-throw">--</span></div>
            <div class="stat-row"><span>Viewing Angle:</span> <span id="res-angle">--</span></div>

            <a id="pdf-link" href="#" target="_blank" class="pdf-btn">
                OPEN ENGINEERING REPORT ↗
            </a>
        </div>
    </div>

    <script>
        // Unit Switcher
        document.getElementById('unit').addEventListener('change', function () {
            if (this.value === "Feet") {
                document.getElementById('length').value = "20";
                document.getElementById('width').value = "15";
                document.getElementById('screenWidth').value = "10";
                document.getElementById('seatDist').value = "14";
            } else {
                document.getElementById('length').value = "6.0";
                document.getElementById('width').value = "4.5";
                document.getElementById('screenWidth').value = "3.5";
                document.getElementById('seatDist').value = "4.5";
            }
        });

        async function runCheck() {
            const btn = document.querySelector('.run-btn');
            const originalText = btn.innerText;
            btn.innerText = "CALCULATING...";

            // Gather Data
            const data = {
                client_name: document.getElementById('clientName').value,
                project_name: document.getElementById('projectName').value,
                integrator_name: document.getElementById('integratorName').value,
                measurement_unit: document.getElementById('unit').value,
                length: parseFloat(document.getElementById('length').value),
                width: parseFloat(document.getElementById('width').value),
                height: 3.0,
                screen_width: parseFloat(document.getElementById('screenWidth').value),
                screen_aspect_ratio: parseFloat(document.getElementById('aspect').value),
                projector_lumens: parseInt(document.getElementById('lumens').value),
                throw_ratio_min: parseFloat(document.getElementById('trMin').value),
                throw_ratio_max: parseFloat(document.getElementById('trMax').value),
                seating_distance: parseFloat(document.getElementById('seatDist').value),
                screen_gain: 1.0,
                screen_mount_offset: 0.5,
                ambient_light: document.getElementById('light').value
            };

            try {
                const response = await fetch('/report', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                if (!response.ok) {
                    const txt = await response.text();
                    alert("SERVER ERROR: " + txt);
                    btn.innerText = "TRY AGAIN";
                    return;
                }

                const result = await response.json();

                // Show Results
                const resultsDiv = document.getElementById('results');
                resultsDiv.style.display = 'block';

                // AUTO-SCROLL
                resultsDiv.scrollIntoView({ behavior: 'smooth', block: 'start' });

                document.getElementById('res-bright').innerHTML = `<span class="${getStatusClass(result.calculations.brightness_status)}">${result.calculations.ftl} fL (${result.calculations.brightness_status})</span>`;
                document.getElementById('res-throw').innerHTML = `<span class="${result.calculations.throw_status === 'PASS' ? 'pass' : 'fail'}">${result.calculations.throw_status}</span>`;
                document.getElementById('res-angle').innerHTML = `<span class="${result.calculations.angle_status === 'PASS' ? 'pass' : 'warn'}">${result.calculations.viewing_angle}° (${result.calculations.angle_status})</span>`;
                document.getElementById('pdf-link').href = "/" + result.pdf_url;

                btn.innerText = originalText;

            } catch (e) {
                alert("BROWSER ERROR: " + e.message);
                btn.innerText = "ERROR";
            }
        }

        function getStatusClass(status) {
            if (status.includes("PASS")) return "pass";
            if (status.includes("WARNING")) return "warn";
            return "fail";
        }
    </script>
</body>

</html>
